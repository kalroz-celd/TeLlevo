name: tellevo
description: "A new Flutter project."
publish_to: "none"
version: 1.0.22+23

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.8.0+1
  device_info_plus: ^11.5.0
  image_picker: ^1.2.1
  camera: ^0.11.2
  path: ^1.8.3
  flutter_native_splash: ^2.4.6
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  mobile_scanner: ^6.0.2
  google_maps_flutter: ^2.7.0
  geocoding: ^2.2.0
  url_launcher: ^6.3.0
  timezone: ^0.9.2
  flutter_launcher_icons: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#0A87C3" # Fondo splash
  image: assets/images/logo.png # Ruta a tu logo
  branding: assets/images/logo.png # (opcional, un logo pequeño abajo)
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#0A87C3"
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icono.png"
  min_sdk_android: 35
